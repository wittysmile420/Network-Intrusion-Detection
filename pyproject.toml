[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snids"
version = "1.0.0"
description = "Safe, header-only Smart Network Intrusion Detection System for a Computer Networks lab"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.0,<4",
]

[project.optional-dependencies]
capture = ["scapy>=2.5,<3"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

